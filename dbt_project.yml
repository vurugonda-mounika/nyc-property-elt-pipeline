# dbt_project.yml
# PURPOSE: Main dbt project configuration file
# Every dbt project has exactly one of these at the root level
# Tells dbt how to run your project — names, paths, materializations
# In real work: same file exists in every dbt project you will ever work on

name: 'nyc_property_pipeline'
version: '1.0.0'
config-version: 2

# dbt profile to use for database connection
# This matches the profile name in profiles.yml on your local machine
profile: 'nyc_property_pipeline'

# Tell dbt where to find different types of files
model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

# Where dbt writes compiled SQL and run results
# This folder is gitignored — not uploaded to GitHub
target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# Model configurations
# This is where you control HOW each layer is stored in Snowflake
models:
  nyc_property_pipeline:

    # Staging layer — materialize as VIEWS
    # Why view? Staging is just cleaning logic — no need to store as a full table
    # Views are computed on the fly — saves storage cost
    # In real work: staging is almost always a view
    staging:
      +materialized: view
      +schema: staging

    # Mart layer — materialize as TABLES
    # Why table? Marts are queried by dashboards and analysts constantly
    # Tables are pre-computed — much faster to query than views
    # In real work: marts are always tables for performance
    marts:
      +materialized: table
      +schema: marts
